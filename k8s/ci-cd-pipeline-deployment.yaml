apiVersion: apps/v1
kind: Deployment
metadata:
  name: cd-cd-pipeline-backend
  labels:
    app: cd-cd-pipeline-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cd-cd-pipeline-backend
  template:
    metadata:
      labels:
        app: cd-cd-pipeline-backend
    spec:
      containers:
      - name: cd-cd-pipeline-backend
        image: cd-cd-pipeline-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3003
---
apiVersion: v1
kind: Service
metadata:
  name: cd-cd-pipeline-backend-service
spec:
  selector:
    app: cd-cd-pipeline-backend
  ports:
  - protocol: TCP
    port: 3003
    targetPort: 3003
  type: ClusterIP 